<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📑 智能书签管理器 · 全自动合并</title>
    <style>
        /* 完整样式（与之前相同，此处为确保长度可读，保留关键样式） */
        :root {
            --bg: #f0f2f5;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eef2ff;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .app-container { display: flex; min-height: 100vh; max-width: 1400px; margin: 0 auto; }
        .sidebar { width: 260px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
        .sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 700; color: var(--primary); }
        .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #fff; }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
        .category-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); font-size: 0.9rem; font-weight: 500; }
        .category-item:hover { background: #f3f4f6; }
        .category-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .color-dot { width: 10px; height: 10px; border-radius: 50%; }
        .count-badge { margin-left: auto; font-size: 0.75rem; background: #e5e7eb; color: #6b7280; padding: 2px 8px; border-radius: 20px; }
        .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all var(--transition); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-outline { background: #fff; border: 1.5px solid var(--border); }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
        .main-content { flex: 1; padding: 20px 24px; }
        .top-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-wrapper { flex: 1; position: relative; }
        .search-wrapper input { width: 100%; padding: 10px 16px 10px 40px; border-radius: 40px; border: 1px solid var(--border); background: #fff; outline: none; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        .sort-toggle { display: flex; background: #f3f4f6; border-radius: 30px; padding: 3px; }
        .sort-btn { padding: 6px 16px; border-radius: 30px; background: transparent; border: none; cursor: pointer; font-size: 0.8rem; }
        .sort-btn.active { background: white; box-shadow: var(--shadow-sm); color: var(--primary); }
        .bookmarks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .bookmark-card { background: #fff; border-radius: 16px; padding: 16px; cursor: pointer; transition: all var(--transition); box-shadow: var(--shadow-sm); border: 1px solid transparent; }
        .bookmark-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: #e0e7ff; }
        .card-top { display: flex; gap: 12px; }
        .favicon-wrapper { width: 40px; height: 40px; background: #f9fafb; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .favicon-img { width: 24px; height: 24px; object-fit: contain; }
        .card-info { flex: 1; }
        .card-title { font-weight: 600; margin-bottom: 4px; }
        .card-url { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-note { font-size: 0.75rem; color: var(--text-secondary); background: #f9fafb; padding: 6px 8px; border-radius: 6px; margin-top: 8px; border-left: 3px solid #e5e7eb; }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 0.7rem; }
        .category-label { padding: 2px 8px; border-radius: 20px; color: white; font-weight: 600; }
        .card-actions { display: flex; gap: 4px; opacity: 0; transition: opacity var(--transition); }
        .bookmark-card:hover .card-actions { opacity: 1; }
        .card-actions button { background: #f3f4f6; border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; }
        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #fff; border-radius: 20px; padding: 24px; width: 90%; max-width: 480px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; }
        .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: #1f2937; color: white; padding: 10px 16px; border-radius: 8px; font-size: 0.8rem; animation: fadeInOut 2.5s ease forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateX(100%); } 10% { opacity: 1; transform: translateX(0); } 90% { opacity: 1; } 100% { opacity: 0; transform: translateX(100%); } }
        .sync-hint { background: #e6f7e6; border-left: 4px solid #22c55e; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.8rem; }
        @media (max-width: 900px) { .sidebar { position: fixed; left: -280px; transition: left 0.2s; z-index: 200; } .sidebar.open { left: 0; } .menu-toggle { display: block; } .main-content { padding: 12px; } }
        .menu-toggle { display: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: #fff; cursor: pointer; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-icon">📑</div>智能书签</div><div class="sidebar-subtitle">全自动合并</div></div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <button class="btn btn-primary" id="btnAddCategory">➕ 新建分类</button>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-outline btn-sm" id="btnExport">📤 导出备份</button>
                <button class="btn btn-outline btn-sm" id="btnImport">📥 导入备份</button>
                <button class="btn btn-outline btn-sm" id="btnPushToGitHub">☁️ 推送云端</button>
            </div>
            <input type="file" id="importFileInput" style="display:none">
        </div>
    </div>
    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="search-wrapper"><input type="text" id="searchInput" placeholder="搜索..."><span class="search-icon">🔍</span></div>
            <div class="sort-toggle" id="sortToggle"><button class="sort-btn active" data-sort="time">时间</button><button class="sort-btn" data-sort="category">分类</button></div>
            <button class="btn btn-primary" id="btnAddBookmark">➕ 添加收藏</button>
        </div>
        <div class="sync-hint">✨ 全自动模式：打开页面自动从 GitHub 拉取并智能合并（去重、保留最新），本地修改永久保存，点击「推送云端」即可同步至 GitHub。</div>
        <div class="section-header"><h3>📌 <span id="currentCategoryLabel">所有收藏</span> <span id="bookmarkCount"></span></h3></div>
        <div class="bookmarks-grid" id="bookmarksGrid"></div>
    </main>
</div>

<div class="modal-overlay" id="bookmarkModal" style="display:none"><div class="modal"><h3 id="bookmarkModalTitle">添加收藏</h3><div class="form-group"><label>URL</label><input id="bmUrl" placeholder="https://"></div><div class="form-group"><label>标题</label><input id="bmTitle"></div><div class="form-group"><label>分类</label><select id="bmCategory"></select></div><div class="form-group"><label>备注</label><textarea id="bmNote" rows="2"></textarea></div><div class="form-actions"><button class="btn btn-outline" id="btnCancelBookmark">取消</button><button class="btn btn-primary" id="btnSaveBookmark">保存</button></div></div></div>
<div class="modal-overlay" id="categoryModal" style="display:none"><div class="modal"><h3 id="categoryModalTitle">新建分类</h3><div class="form-group"><label>名称</label><input id="catName"></div><div class="form-group"><label>颜色</label><div id="colorPicker" style="display:flex; gap:6px;"></div></div><div class="form-actions"><button class="btn btn-outline" id="btnCancelCategory">取消</button><button class="btn btn-primary" id="btnSaveCategory">保存</button></div></div></div>
<div class="toast-container" id="toastContainer"></div>

<script>
(function(){
    // ======================== 配置 ========================
    const REMOTE_API_URL = 'https://api.github.com/repos/candy-happy/mybookmark/contents/bookmarks.json';
    const STORAGE_KEY_BOOKMARKS = 'bm_bookmarks';
    const STORAGE_KEY_CATEGORIES = 'bm_categories';
    const DEFAULT_CATEGORY_ID = '__default__';
    const PRESET_COLORS = ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#eab308','#22c55e','#14b8a6','#06b6d1','#3b82f6','#a855f7'];

    let categories = [];
    let bookmarks = [];
    let activeCategoryId = '__all__';
    let sortMode = 'time';
    let editingBookmarkId = null;
    let editingCategoryId = null;
    let selectedColor = PRESET_COLORS[0];

    // DOM 元素
    const $sidebar = document.getElementById('sidebar');
    const $menuToggle = document.getElementById('menuToggle');
    const $sidebarNav = document.getElementById('sidebarNav');
    const $bookmarksGrid = document.getElementById('bookmarksGrid');
    const $searchInput = document.getElementById('searchInput');
    const $currentCategoryLabel = document.getElementById('currentCategoryLabel');
    const $bookmarkCount = document.getElementById('bookmarkCount');
    const $bookmarkModal = document.getElementById('bookmarkModal');
    const $categoryModal = document.getElementById('categoryModal');
    const $toastContainer = document.getElementById('toastContainer');
    const $importFileInput = document.getElementById('importFileInput');
    const $sortToggle = document.getElementById('sortToggle');

    // 工具函数
    function showToast(msg, type='success') {
        const toast = document.createElement('div'); toast.className = `toast ${type}`; toast.textContent = msg;
        $toastContainer.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    function generateId() { return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,8); }
    function nowTs() { return Date.now(); }
    function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
    function normalizeUrl(url) { if(!url) return ''; url=url.trim(); if(!/^https?:\/\//i.test(url)) url='https://'+url; return url; }
    function extractDomain(url) { try { return new URL(url).hostname; } catch(e) { return url.split('/')[0]; } }
    function getFaviconUrl(url) { return `https://${extractDomain(url)}/favicon.ico`; }
    function getDisplayUrl(url) { try { return new URL(url).hostname.replace(/^www\./,''); } catch(e) { return url.split('/')[0]; } }
    function getRelativeTime(ts) { const diff = Date.now()-ts; const mins = Math.floor(diff/60000); if(mins<1) return '刚刚'; if(mins<60) return mins+'分钟前'; if(mins<1440) return Math.floor(mins/60)+'小时前'; if(mins<10080) return Math.floor(mins/1440)+'天前'; return Math.floor(mins/10080)+'周前'; }
    function saveToLocal() {
        localStorage.setItem(STORAGE_KEY_CATEGORIES, JSON.stringify(categories));
        localStorage.setItem(STORAGE_KEY_BOOKMARKS, JSON.stringify(bookmarks));
    }
    function getCategoryById(id) { return categories.find(c=>c.id===id); }
    function getBookmarkCount(catId) { return bookmarks.filter(b=>b.categoryId===catId).length; }

    // ========== 智能合并逻辑 ==========
    function mergeBookmarks(localArr, remoteArr) {
        const map = new Map();
        for (const b of localArr) map.set(b.id, { ...b });
        for (const r of remoteArr) {
            if (!map.has(r.id)) {
                map.set(r.id, { ...r });
            } else {
                const local = map.get(r.id);
                const localTime = local.updatedAt || local.createdAt || 0;
                const remoteTime = r.updatedAt || r.createdAt || 0;
                if (remoteTime > localTime) map.set(r.id, { ...r });
            }
        }
        return Array.from(map.values());
    }
    function mergeCategories(localArr, remoteArr) {
        const map = new Map();
        for (const c of localArr) map.set(c.id, { ...c });
        for (const r of remoteArr) {
            if (!map.has(r.id)) map.set(r.id, { ...r });
            else {
                const local = map.get(r.id);
                const localTime = local.updatedAt || 0;
                const remoteTime = r.updatedAt || 0;
                if (remoteTime > localTime) map.set(r.id, { ...r });
            }
        }
        if (!map.has(DEFAULT_CATEGORY_ID)) {
            map.set(DEFAULT_CATEGORY_ID, { id: DEFAULT_CATEGORY_ID, name: '未分类', color: '#9ca3af', isDefault: true, updatedAt: nowTs() });
        }
        return Array.from(map.values());
    }

    // 从 GitHub 获取远程数据
    async function fetchRemote() {
        try {
            const res = await fetch(REMOTE_API_URL, { cache: 'no-cache' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const decoded = decodeURIComponent(escape(atob(data.content)));
            const remote = JSON.parse(decoded);
            if (!remote.categories || !remote.bookmarks) throw new Error('格式错误');
            remote.bookmarks = remote.bookmarks.map(b => ({ ...b, updatedAt: b.updatedAt || b.createdAt || nowTs() }));
            remote.categories = remote.categories.map(c => ({ ...c, updatedAt: c.updatedAt || nowTs() }));
            return remote;
        } catch (err) {
            console.warn('fetch remote error', err);
            return null;
        }
    }

    // 自动合并并保存本地
    async function autoMerge() {
        const remote = await fetchRemote();
        if (!remote) return false;
        const newBookmarks = mergeBookmarks(bookmarks, remote.bookmarks);
        const newCategories = mergeCategories(categories, remote.categories);
        const changed = JSON.stringify(bookmarks) !== JSON.stringify(newBookmarks) || JSON.stringify(categories) !== JSON.stringify(newCategories);
        if (changed) {
            bookmarks = newBookmarks;
            categories = newCategories;
            saveToLocal();
            showToast('已自动与云端合并', 'success');
        }
        return changed;
    }

    // 加载本地数据（首次）
    function loadLocal() {
        const savedCat = localStorage.getItem(STORAGE_KEY_CATEGORIES);
        const savedBm = localStorage.getItem(STORAGE_KEY_BOOKMARKS);
        if (savedCat && savedBm) {
            categories = JSON.parse(savedCat);
            bookmarks = JSON.parse(savedBm);
        } else {
            categories = [{ id: DEFAULT_CATEGORY_ID, name: '未分类', color: '#9ca3af', isDefault: true, updatedAt: nowTs() }];
            bookmarks = [];
        }
        // 补全 updatedAt
        bookmarks = bookmarks.map(b => ({ ...b, updatedAt: b.updatedAt || b.createdAt || nowTs() }));
        categories = categories.map(c => ({ ...c, updatedAt: c.updatedAt || nowTs() }));
        if (!categories.find(c=>c.id===DEFAULT_CATEGORY_ID)) {
            categories.unshift({ id: DEFAULT_CATEGORY_ID, name: '未分类', color: '#9ca3af', isDefault: true, updatedAt: nowTs() });
        }
        const validIds = new Set(categories.map(c=>c.id));
        bookmarks.forEach(b => { if (!validIds.has(b.categoryId)) b.categoryId = DEFAULT_CATEGORY_ID; });
        saveToLocal();
    }

    // 推送本地到 GitHub（手动）
    async function pushToGitHub() {
        const token = prompt('请输入 GitHub Personal Access Token (需 repo 权限):\n获取: https://github.com/settings/tokens/new');
        if (!token) return;
        const exportData = { categories, bookmarks, exportDate: new Date().toISOString() };
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(exportData, null, 2))));
        try {
            let sha = null;
            const fileRes = await fetch(REMOTE_API_URL, { headers: { Authorization: `token ${token}` } });
            if (fileRes.ok) {
                const fileData = await fileRes.json();
                sha = fileData.sha;
            }
            const putRes = await fetch(REMOTE_API_URL, {
                method: 'PUT',
                headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: '手动同步', content, sha })
            });
            if (putRes.ok) {
                showToast('✅ 已推送至 GitHub', 'success');
                localStorage.setItem('bm_last_push', nowTs().toString());
            } else {
                const err = await putRes.json();
                showToast('推送失败: ' + (err.message || '未知'), 'error');
            }
        } catch (err) {
            showToast('网络错误', 'error');
        }
    }

    // ========== 渲染 UI ==========
    function renderSidebar() {
        $sidebarNav.innerHTML = '';
        const allItem = document.createElement('div');
        allItem.className = `category-item ${activeCategoryId === '__all__' ? 'active' : ''}`;
        allItem.innerHTML = `<span class="color-dot" style="background:#6366f1;"></span><span>📌 所有收藏</span><span class="count-badge">${bookmarks.length}</span>`;
        allItem.addEventListener('click', () => setActiveCategory('__all__'));
        $sidebarNav.appendChild(allItem);
        categories.forEach(cat => {
            const isDefault = cat.id === DEFAULT_CATEGORY_ID;
            const item = document.createElement('div');
            item.className = `category-item ${activeCategoryId === cat.id ? 'active' : ''}`;
            item.dataset.categoryId = cat.id;
            item.innerHTML = `<span class="color-dot" style="background:${cat.color};"></span><span>${escapeHtml(cat.name)}</span><span class="count-badge">${getBookmarkCount(cat.id)}</span>${!isDefault ? `<span class="category-actions"><button class="edit-cat-btn">✏️</button><button class="delete-cat-btn">🗑️</button></span>` : ''}`;
            item.addEventListener('click', (e) => { if(e.target.closest('.edit-cat-btn')||e.target.closest('.delete-cat-btn')) return; setActiveCategory(cat.id); });
            const editBtn = item.querySelector('.edit-cat-btn');
            if(editBtn) editBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openCategoryModal(cat); });
            const delBtn = item.querySelector('.delete-cat-btn');
            if(delBtn) delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteCategory(cat.id); });
            $sidebarNav.appendChild(item);
        });
    }

    function renderBookmarks() {
        $bookmarksGrid.innerHTML = '';
        let filtered = activeCategoryId === '__all__' ? [...bookmarks] : bookmarks.filter(b=>b.categoryId===activeCategoryId);
        const term = $searchInput.value.trim().toLowerCase();
        if(term) filtered = filtered.filter(b=> b.title.toLowerCase().includes(term) || b.url.toLowerCase().includes(term) || (b.note && b.note.toLowerCase().includes(term)));
        if(sortMode === 'category') {
            const order = {}; categories.forEach((c,i)=>order[c.id]=i);
            filtered.sort((a,b)=>{ const oa=order[a.categoryId]??9999, ob=order[b.categoryId]??9999; if(oa!==ob) return oa-ob; return (b.updatedAt||0)-(a.updatedAt||0); });
        } else {
            filtered.sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
        }
        $currentCategoryLabel.textContent = activeCategoryId==='__all__' ? '所有收藏' : (getCategoryById(activeCategoryId)?.name || '收藏');
        $bookmarkCount.textContent = `(${filtered.length}个)`;
        if(filtered.length===0) {
            $bookmarksGrid.innerHTML = `<div class="empty-state">📭 暂无收藏</div>`;
            return;
        }
        filtered.forEach(bm => {
            const cat = getCategoryById(bm.categoryId);
            const card = document.createElement('div'); card.className = 'bookmark-card';
            card.innerHTML = `
                <div class="card-top">
                    <div class="favicon-wrapper"><img class="favicon-img" src="${getFaviconUrl(bm.url)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%239ca3af\'%3E%3Cpath d=\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z\'/%3E%3C/svg%3E';"></div>
                    <div class="card-info"><div class="card-title">${escapeHtml(bm.title)}</div><div class="card-url">${escapeHtml(getDisplayUrl(bm.url))}</div></div>
                </div>
                ${bm.note ? `<div class="card-note">💬 ${escapeHtml(bm.note)}</div>` : ''}
                <div class="card-bottom">
                    <span class="category-label" style="background:${cat?.color||'#9ca3af'}">${escapeHtml(cat?.name||'未分类')}</span>
                    <span>${getRelativeTime(bm.updatedAt||bm.createdAt)}</span>
                    <span class="card-actions"><button class="edit-bm-btn">✏️</button><button class="delete-bm-btn">🗑️</button></span>
                </div>
            `;
            card.addEventListener('click', (e) => { if(!e.target.closest('.edit-bm-btn') && !e.target.closest('.delete-bm-btn')) window.open(normalizeUrl(bm.url), '_blank'); });
            card.querySelector('.edit-bm-btn').addEventListener('click', (e) => { e.stopPropagation(); openBookmarkModal(bm); });
            card.querySelector('.delete-bm-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteBookmark(bm.id); });
            $bookmarksGrid.appendChild(card);
        });
    }
    function renderAll() { renderSidebar(); renderBookmarks(); }
    function setActiveCategory(id) { activeCategoryId = id; renderAll(); closeSidebar(); }
    function closeSidebar() { $sidebar.classList.remove('open'); }
    function toggleSidebar() { $sidebar.classList.toggle('open'); }

    // 分类 CRUD
    function openCategoryModal(cat=null) {
        editingCategoryId = cat?.id || null;
        selectedColor = cat?.color || PRESET_COLORS[0];
        document.getElementById('catName').value = cat?.name || '';
        renderColorPicker();
        $categoryModal.style.display = 'flex';
    }
    function closeCategoryModal() { $categoryModal.style.display = 'none'; editingCategoryId=null; }
    function renderColorPicker() {
        const picker = document.getElementById('colorPicker'); picker.innerHTML='';
        PRESET_COLORS.forEach(c=>{
            const btn = document.createElement('div'); btn.style.cssText = `width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;border:2px solid ${c===selectedColor?'white':'transparent'};box-shadow:${c===selectedColor?'0 0 0 1px #ccc':''}`;
            btn.addEventListener('click', ()=>{ selectedColor=c; renderColorPicker(); });
            picker.appendChild(btn);
        });
    }
    function saveCategory() {
        const name = document.getElementById('catName').value.trim();
        if(!name) return showToast('请输入分类名','error');
        if(categories.some(c=>c.name===name && c.id!==editingCategoryId)) return showToast('分类名重复','error');
        if(editingCategoryId) {
            const cat = categories.find(c=>c.id===editingCategoryId);
            if(cat){ cat.name=name; cat.color=selectedColor; cat.updatedAt=nowTs(); }
        } else {
            categories.push({ id: generateId(), name, color: selectedColor, updatedAt: nowTs() });
        }
        saveToLocal(); closeCategoryModal(); renderAll(); showToast('分类已保存');
    }
    function deleteCategory(id) {
        if(id===DEFAULT_CATEGORY_ID) return showToast('默认分类不能删除','error');
        if(!confirm('删除分类后其下书签将移至“未分类”，确定？')) return;
        bookmarks.forEach(b=>{ if(b.categoryId===id) b.categoryId=DEFAULT_CATEGORY_ID; });
        categories = categories.filter(c=>c.id!==id);
        if(activeCategoryId===id) activeCategoryId='__all__';
        saveToLocal(); renderAll(); showToast('已删除');
    }

    // 书签 CRUD
    function openBookmarkModal(bm=null) {
        editingBookmarkId = bm?.id || null;
        document.getElementById('bmUrl').value = bm?.url || '';
        document.getElementById('bmTitle').value = bm?.title || '';
        document.getElementById('bmNote').value = bm?.note || '';
        const sel = document.getElementById('bmCategory'); sel.innerHTML='';
        categories.forEach(c=>{
            const opt = document.createElement('option'); opt.value=c.id; opt.textContent=c.name;
            if(bm && bm.categoryId===c.id) opt.selected=true;
            if(!bm && activeCategoryId!=='__all__' && activeCategoryId===c.id) opt.selected=true;
            sel.appendChild(opt);
        });
        $bookmarkModal.style.display='flex';
    }
    function closeBookmarkModal() { $bookmarkModal.style.display='none'; editingBookmarkId=null; }
    function saveBookmark() {
        const url = document.getElementById('bmUrl').value.trim();
        const title = document.getElementById('bmTitle').value.trim();
        const note = document.getElementById('bmNote').value.trim();
        const catId = document.getElementById('bmCategory').value;
        if(!url || !title) return showToast('请填写网址和标题','error');
        const nUrl = normalizeUrl(url);
        try { new URL(nUrl); } catch(e) { return showToast('网址格式不正确','error'); }
        const now = nowTs();
        if(editingBookmarkId) {
            const bm = bookmarks.find(b=>b.id===editingBookmarkId);
            if(bm){ bm.url=nUrl; bm.title=title; bm.note=note; bm.categoryId=catId; bm.updatedAt=now; }
        } else {
            bookmarks.unshift({ id: generateId(), url: nUrl, title, note, categoryId: catId, createdAt: now, updatedAt: now });
        }
        saveToLocal(); closeBookmarkModal(); renderAll(); showToast('已保存');
    }
    function deleteBookmark(id) {
        if(!confirm('确定删除？')) return;
        bookmarks = bookmarks.filter(b=>b.id!==id);
        saveToLocal(); renderAll(); showToast('已删除');
    }

    // 导入导出
    function exportData() {
        const data = { categories, bookmarks, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
        const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`bookmarks_${new Date().toISOString().slice(0,10)}.json`; a.click();
        showToast('导出成功');
    }
    function importData(file) {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const data = JSON.parse(e.target.result);
                if(!data.categories || !data.bookmarks) throw new Error();
                if(!confirm('导入将覆盖当前所有数据，确定吗？')) return;
                categories = data.categories;
                bookmarks = data.bookmarks;
                if(!categories.find(c=>c.id===DEFAULT_CATEGORY_ID)) categories.unshift({id:DEFAULT_CATEGORY_ID,name:'未分类',color:'#9ca3af',isDefault:true,updatedAt:nowTs()});
                bookmarks = bookmarks.map(b=>({...b, updatedAt:b.updatedAt||b.createdAt||nowTs()}));
                saveToLocal(); renderAll(); showToast('导入成功');
            } catch(err) { showToast('文件格式错误','error'); }
        };
        reader.readAsText(file);
    }

    // 事件绑定
    $menuToggle.addEventListener('click', toggleSidebar);
    $searchInput.addEventListener('input', () => renderBookmarks());
    $sortToggle.addEventListener('click', (e) => {
        const btn = e.target.closest('.sort-btn'); if(!btn) return;
        sortMode = btn.dataset.sort;
        document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        renderBookmarks();
    });
    document.getElementById('btnAddBookmark').addEventListener('click', ()=>openBookmarkModal());
    document.getElementById('btnCancelBookmark').addEventListener('click', closeBookmarkModal);
    document.getElementById('btnSaveBookmark').addEventListener('click', saveBookmark);
    document.getElementById('btnAddCategory').addEventListener('click', ()=>openCategoryModal());
    document.getElementById('btnCancelCategory').addEventListener('click', closeCategoryModal);
    document.getElementById('btnSaveCategory').addEventListener('click', saveCategory);
    document.getElementById('btnExport').addEventListener('click', exportData);
    document.getElementById('btnImport').addEventListener('click', ()=>$importFileInput.click());
    $importFileInput.addEventListener('change', (e)=>{ if(e.target.files[0]) importData(e.target.files[0]); $importFileInput.value=''; });
    document.getElementById('btnPushToGitHub').addEventListener('click', pushToGitHub);
    $bookmarkModal.addEventListener('click', (e)=>{ if(e.target===e.currentTarget) closeBookmarkModal(); });
    $categoryModal.addEventListener('click', (e)=>{ if(e.target===e.currentTarget) closeCategoryModal(); });

    // 初始化：加载本地 + 自动合并 + 渲染
    async function init() {
        loadLocal();
        renderAll();
        await autoMerge();   // 自动拉取并合并
        renderAll();         // 合并后刷新界面
        if(window.innerWidth>900) $searchInput.focus();
    }
    init();
})();
</script>
</body>
</html>
